name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build binaries & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint + typecheck
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build platform binaries
        run: bun run scripts/release-binaries.ts

      - name: Generate checksums
        run: |
          cd bin
          sha256sum easysql-* > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            bin/easysql-linux-x64
            bin/easysql-linux-arm64
            bin/easysql-darwin-x64
            bin/easysql-darwin-arm64
            bin/easysql-windows-x64.exe
            bin/SHA256SUMS
          body: |
            ## EasySQL CLI ${{ github.ref_name }}

            Open-source standalone binaries of the EasySQL CLI — run natural-language
            queries against your local MySQL or PostgreSQL database, with credentials
            that never leave your machine.

            ### Install

            ```bash
            # Linux / macOS — pick the asset for your platform:
            curl -L https://github.com/Clearsoft-net/easysql-cli/releases/latest/download/easysql-linux-x64 -o easysql
            chmod +x ./easysql
            ./easysql --help
            ```

            ### Checksums
            See `SHA256SUMS` attached to this release.

            ### Self-update
            ```bash
            easysql update --check
            easysql update
            ```
